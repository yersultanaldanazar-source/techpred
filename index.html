<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Guarantor — A local student who vouches for you to Almaty landlords</title>
    
    <!-- Premium Typography: Serif + Sans-Serif + Monospace -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lenis Smooth Inertial Scroll -->
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>

    <style>
      :root {
        --font-serif: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      body {
        font-family: var(--font-sans);
        background-color: #0a0c0b;
        color: #edeae1;
        overflow-x: hidden;
        margin: 0;
      }
      .font-editorial {
        font-family: var(--font-serif);
      }
      .font-mono-tag {
        font-family: var(--font-mono);
      }
      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0c0b;
      }
      ::-webkit-scrollbar-thumb {
        background: #333b35;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b5472b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          duration: 1.25,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
        });
        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
      }
    </script>
  </body>
</html>
